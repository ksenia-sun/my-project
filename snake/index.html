<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Snake</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			text-align: center;
			font-family: Arial, sans-serif;
		}
		.canvas-container {
			border: 2px solid #000;
		}
		.score-item {
			margin-top: 10px;
			font-size: 20px;
		}
		.start-button {
			margin-top: 20px;
			padding: 10px 20px;
			font-size: 16px;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<h1>Игра "Змейка"</h1>
	<p>Управление: стрелки ⬆️, ⬇️, ⬅️, ➡️</p>
	<p id="score" class="score-item">Счет: 0, скорость: 150</p>

	<canvas id="canvas" class="canvas-container" width="400" height="400"></canvas>

	<div>
		<button class="start-button">Начать игру</button>
	</div>

<script>
	const scoreItem = document.querySelector('.score-item');
	const startButton = document.querySelector('.start-button');
	const canvas = document.querySelector('.canvas-container');
	const ctx = canvas.getContext('2d');

	const gridSize = 20;
	let snake, direction, food, score, gameSpeed;
    
	const startGame = () => {
		snake = [{
			x: 200,
			y: 200
		}];

		// default: the snake moves to the right
		direction = "RIGHT";

		// создание еды
		food = getRandomFoodPosition(); // food = { x, y }
		score = 0;
		gameSpeed = 150;

		scoreItem.textContent = `Счет: 0, скорость: ${gameSpeed}`;
		startButton.style.display = 'none';


		gameLoop();
	};

	function getRandomFoodPosition() {
		return {
			x: Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize,
			y: Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize,
		}
	}

	const gameLoop = () => {
		ctx.clearRect(0,0, canvas.width, canvas.height);

		// apple
		ctx.fillStyle = '#f00';
		ctx.fillRect(food.x, food.y, gridSize, gridSize);
		// head snake
	    ctx.fillStyle = '#0f0';
	    ctx.fillRect(snake[0].x, snake[0].y, gridSize, gridSize);
		// body snake
		ctx.fillStyle = '#f0f';
		for (let i = 1; i < snake.length; i++) {
	        ctx.fillRect(snake[i].x, snake[i].y, gridSize, gridSize);
	    }

		let head = { ...snake[0] };
		if (direction === 'UP')    head.y -= gridSize;
		if (direction === 'DOWN')  head.y += gridSize;
		if (direction === 'LEFT')  head.x -= gridSize;
		if (direction === 'RIGHT') head.x += gridSize;

		snake.unshift(head);

		if (head.x === food.x && head.y === food.y) {
			food = getRandomFoodPosition();
			score += 1;

			if (gameSpeed > 50) gameSpeed -= 5;

			scoreItem.textContent = `Счет: ${score}, скорость: ${gameSpeed}`;
		} else {
			// delete tail
			snake.pop();
		}

		if (snake.length > 0) {
			setTimeout(gameLoop, gameSpeed);
		}
	};

	const changeDirection = (event) => {
		const key = event.key;

		if (key === 'ArrowUp' && direction !== 'DOWN')         direction = 'UP';
		else if (key === 'ArrowDown' && direction !== 'UP')    direction = 'DOWN';
		else if (key === 'ArrowLeft' && direction !== 'RIGHT') direction = 'LEFT'; 
		else if (key === 'ArrowRight' && direction !== 'LEFT') direction = 'RIGHT';
	};

	document.addEventListener('keydown', changeDirection);
	startButton.addEventListener('click', startGame);

</script>

</body>
</html>
