<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover"> -->
    <title>Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .content-container {
            padding: 20px;
        }
        .canvas-container {
            border: 2px solid #000;
            /*width: 100%;*/
            /*max-width: 400px;
            height: auto;*/
        }
        .score-item {
            margin-top: 10px;
            font-size: 20px;
        }
        .checkbox-item {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            text-align: left;
            margin-bottom: 5px;
            cursor: pointer;
        }
        .checkbox-item input {
            margin-right: 5px;
        }
        .start-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .control-tips-mobile {
            display: none;
        }

        .is-web {
            display: block;
        }
        .is-mobile {
            display: none;
        }

        @media screen and (max-device-width: 768px) {
            .is-web {
                display: none;
            }
            .is-mobile {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="content-container">
        <h1>Игра "Змейка"</h1>
        <p class="control-tips is-web">Управление: стрелки ⬆️, ⬇️, ⬅️, ➡️</p>
        <p class="control-tips is-web">Пауза: P / З</p>
        <p class="control-tips is-mobile">Управление: swipe ⬆️, ⬇️, ⬅️, ➡️</p>
        <p class="control-tips is-mobile">Пауза: single short tap</p>
        <p id="score" class="score-item">Счет: 0, скорость: 150</p>
        <p id="record" class="record-item">Рекорд: 0</p>

        <canvas id="canvas" class="canvas-container"></canvas>
        <div class="consolelog"></div>

        <div class="checkbox-item form-item">
            <input type="checkbox">
            <span>Включить подсветку пути</span>
        </div>

        <div>
            <button class="start-button">Начать игру</button>
        </div>
    </div>

<script>
    const contentContainer = document.querySelector('.content-container');
    const scoreItem = document.querySelector('.score-item');
    const recordItem = document.querySelector('.record-item');
    let recordNum;
    recordNum = JSON.parse(localStorage.getItem('record')) || 0;
    recordItem.textContent = `Рекорд: ${recordNum}`;

    const startButton = document.querySelector('.start-button');
    const canvas = document.querySelector('.canvas-container');
    const ctx = canvas.getContext('2d');

    // let gridSize = 20;
    const gridSize = 20;
    let snake, direction, food, score, gameSpeed, gameRunning;
    let isPaused = false;

    const checkboxItem = document.querySelector('.checkbox-item');
    const checkbox = document.querySelector('input');
    let isPathLighting = checkbox.checked ? true : false;

    checkboxItem.addEventListener('click', e => {
        const hasChecked = checkbox.checked;
        checkbox.checked = !checkbox.checked;
        checkbox.dispatchEvent(new Event('change'));
        if (checkbox.checked === true) {
            isPathLighting = true;
        }
        else {
            isPathLighting = false;
        }
    });
    
    const startGame = () => {
        snake = [{
            x: 200,
            y: 200
        }];

        // default: the snake moves to the right
        direction = "RIGHT";

        // создание еды
        food = getRandomFoodPosition(); // food = { x, y }
        score = 0;
        gameSpeed = 150;
        gameRunning = true;

        scoreItem.textContent = `Счет: 0, скорость: ${gameSpeed}`;
        startButton.style.display = 'none';


        gameLoop();
    };

    function getRandomFoodPosition() {
        return {
            x: Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize,
            y: Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize,
        }
    }

    function gameOver() {
        gameRunning = false;
        console.log(`Игра окончена, Ваш счет: ${score}.`);
        startButton.style.display = 'initial';

        if (score > recordNum) {
            recordItem.textContent = `Рекорд: ${score}`;
            localStorage.setItem('record', score);
        }
    }

    const gameLoop = () => {
        ctx.clearRect(0,0, canvas.width, canvas.height);

        // if the game is paused, do not continue the loop
        if (isPaused) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('ПАУЗА', canvas.width / 2, canvas.height / 2);
            ctx.font = '20px Arial';
            ctx.fillText('P / З — продолжить', canvas.width / 2, canvas.height / 2 + 30);
            ctx.fillText('или нажмите любую стрелку', canvas.width / 2, canvas.height / 2 + 50);
            ctx.fillText('⬆️, ⬇️, ⬅️, ➡️', canvas.width / 2, canvas.height / 2 + 75);
            return;
        }


        if (isPathLighting) {
            // row highlighting depending on the direction
            ctx.fillStyle = 'rgba(173, 216, 230, 0.3)';

            if (direction === 'UP' || direction === 'DOWN') {
                // vertical row
                ctx.fillRect(snake[0].x, 0, gridSize, canvas.height);
            } else if (direction === 'LEFT' || direction === 'RIGHT') {
                // horizontal row
                ctx.fillRect(0, snake[0].y, canvas.width, gridSize);
            }
        }


        // apple
        ctx.fillStyle = '#f00';
        ctx.fillRect(food.x, food.y, gridSize, gridSize);
        // head snake
        ctx.fillStyle = '#0f0';
        ctx.fillRect(snake[0].x, snake[0].y, gridSize, gridSize);
        // body snake
        ctx.fillStyle = '#f0f';
        for (let i = 1; i < snake.length; i++) {
            ctx.fillRect(snake[i].x, snake[i].y, gridSize, gridSize);
        }

        let head = { ...snake[0] };
        if (direction === 'UP')    head.y -= gridSize;
        if (direction === 'DOWN')  head.y += gridSize;
        if (direction === 'LEFT')  head.x -= gridSize;
        if (direction === 'RIGHT') head.x += gridSize;

        // if hit a wall - game over
        if (head.x < 0 || head.x >= canvas.width ||
            head.y < 0 || head.y >= canvas.height) {
            gameOver();
            return;
        }
        // if run into ourselves
        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                gameOver();
                return;
            }
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            food = getRandomFoodPosition();
            score += 1;

            if (gameSpeed > 50) gameSpeed -= 5;

            scoreItem.textContent = `Счет: ${score}, скорость: ${gameSpeed}`;

            if ('vibrate' in navigator) {
                navigator.vibrate(100);
            }
        } else {
            // delete tail
            snake.pop();
        }

        if (snake.length > 0) {
            setTimeout(gameLoop, gameSpeed);
        }


        // draw the grid
        ctx.lineWidth = 0.1;
        ctx.strokeStyle = "grey"

        // draw vertical lines
        for (let x = 0; x < canvas.width; x += 20) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        // draw horizontal lines
        for (let y = 0; y < canvas.height; y += 20) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
    };

    const changeDirection = (event) => {
        const key = event.key;
        const code = event.code;

        // pause: P or Z - the same physical key
        if (code === 'KeyP' || code === 'KeyR') {
            event.preventDefault();
            isPaused = !isPaused;
            console.log(isPaused ? 'Игра на паузе' : 'Игра возобновлена (P)');

            if (!isPaused) {
                gameLoop();
            }
            return;
        }

        // if the game is paused, any arrow key press will unpause the game
        if (isPaused) {
            if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight') {
                isPaused = false;
                console.log('Игра возобновлена стрелкой');
                gameLoop(); // let's resume the game
            }
            else {
                return;
            }
        }

        if (key === 'ArrowUp' && direction !== 'DOWN')         direction = 'UP';
        else if (key === 'ArrowDown' && direction !== 'UP')    direction = 'DOWN';
        else if (key === 'ArrowLeft' && direction !== 'RIGHT') direction = 'LEFT'; 
        else if (key === 'ArrowRight' && direction !== 'LEFT') direction = 'RIGHT';

    };

    document.addEventListener('keydown', changeDirection);
    startButton.addEventListener('click', startGame);

    // === detecting swipe ===
    // variables to track touch events
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;
    const minSwipeDistance = canvas.width / 13.5; // threshold for swipe
    const maxTapTime = 300; // maximum time for tap (in milliseconds)
    const maxTapDistance = 10; // maximum movement for tap (in pixels)

    // touch start handler
    canvas.addEventListener('touchstart', (event) => {
        event.preventDefault(); // prevent page scrolling
        const touch = event.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        touchStartTime = Date.now(); // remember the start time of the touch
    });

    // touch end handler
    canvas.addEventListener('touchend', (event) => {
        event.preventDefault();
        if (!gameRunning) return; // if the game is not running, do nothing

        const touchEndTime = Date.now();
        const touchDuration = touchEndTime - touchStartTime;
        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - touchStartX;
        const deltaY = touch.clientY - touchStartY;

        // check if it's a tap
        if (
            touchDuration < maxTapTime &&
            Math.abs(deltaX) < maxTapDistance &&
            Math.abs(deltaY) < maxTapDistance
        ) {
            isPaused = !isPaused; // toggle pause
            console.log(isPaused ? 'Игра на паузе (тап)' : 'Игра возобновлена (тап)');
            if (!isPaused) {
                gameLoop(); // Resume the game if the pause is lifted
            }
            return;
        }

        // check if the movement is large enough for a swipe
        if (Math.abs(deltaX) > minSwipeDistance || Math.abs(deltaY) > minSwipeDistance) {
            console.log('swipe');
            // if the game is paused, any swipe resumes the game
            if (isPaused) {
                isPaused = false;
                console.log('Игра возобновлена свайпом');
                gameLoop();
            }
            // determine the swipe direction
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // horizontal swipe
                if (deltaX > 0 && direction !== 'LEFT') {
                    direction = 'RIGHT';
                } else if (deltaX < 0 && direction !== 'RIGHT') {
                    direction = 'LEFT';
                }
            } else {
                // vertical swipe
                if (deltaY > 0 && direction !== 'UP') {
                    direction = 'DOWN';
                } else if (deltaY < 0 && direction !== 'DOWN') {
                    direction = 'UP';
                }
            }
        }
    });


    // adaptation to screen size
    const resizeCanvas = () => {
        // maximum and minimum canvas width
        const maxWidth = 400; // maximum canvas size
        const minWidth = 200; // minimum size for gameplay convenience

        // considering the screen width and height, choose the smaller value
        // get the width including padding but excluding border/margin
        const widthWithPadding = contentContainer.getBoundingClientRect().width;
        // get the computed styles to find padding values
        const computedStyle = getComputedStyle(contentContainer);
        const paddingLeft = parseFloat(computedStyle.paddingLeft) || 0;
        const paddingRight = parseFloat(computedStyle.paddingRight) || 0;
        // calculate the content width without padding
        const contentWidth = widthWithPadding - paddingLeft - paddingRight;
        const availableWidth = Math.min(contentWidth, window.innerHeight);

        // limit the canvas width
        let newWidth = Math.min(availableWidth, maxWidth);
        newWidth = Math.max(newWidth, minWidth);

        // round the width to a multiple of gridSize to make the field whole
        canvas.width = Math.floor(newWidth / gridSize) * gridSize;
        canvas.height = canvas.width; // keep the field square

        // recalculate the snake and food positions if the game is running
        if (gameRunning && snake && food) {
            snake = snake.map(segment => ({
                x: Math.min(Math.floor(segment.x / gridSize) * gridSize, canvas.width - gridSize),
                y: Math.min(Math.floor(segment.y / gridSize) * gridSize, canvas.height - gridSize)
            }));

            food.x = Math.min(Math.floor(food.x / gridSize) * gridSize, canvas.width - gridSize);
            food.y = Math.min(Math.floor(food.y / gridSize) * gridSize, canvas.height - gridSize);
        }
    };

    // debouncing for resize and orientationchange events
    let resizeTimeout;
    const debounceResize = () => {
        if (window.innerWidth < 500) {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 100);
        }
    };

    // event handlers
    window.addEventListener('resize', debounceResize);
    window.addEventListener('orientationchange', debounceResize);

    // call on initial load
    resizeCanvas();

</script>

</body>
</html>
